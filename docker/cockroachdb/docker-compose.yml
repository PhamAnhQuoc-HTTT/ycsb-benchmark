# CockroachDB v23.2.4 cluster 3-node for YCSB benchmark
# Architecture: Distributed SQL with Raft consensus per range
# Bootstrap: parallel start (no depends_on), then manual `cockroach init`
# Security: --insecure mode (no TLS, dev/benchmark only)
# Port mapping:
#   SQL client + inter-node RPC: 26257-26259 -> 26257
#   Admin UI:                    8080-8082    -> 8080

services:
  crdb1:
    image: cockroachdb/cockroach:v23.2.4
    container_name: ycsb-crdb1
    hostname: crdb1
    restart: unless-stopped
    ports:
      - "26257:26257"
      - "8080:8080"
    networks:
      - crdb-cluster
    volumes:
      - crdb1-data:/cockroach/cockroach-data
    command:
      - start
      - --insecure
      - --join=crdb1:26257,crdb2:26257,crdb3:26257
      - --listen-addr=crdb1:26257
      - --advertise-addr=crdb1:26257
      - --http-addr=0.0.0.0:8080
      - --cache=512MiB
      - --max-sql-memory=512MiB
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health?ready=1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'

  crdb2:
    image: cockroachdb/cockroach:v23.2.4
    container_name: ycsb-crdb2
    hostname: crdb2
    restart: unless-stopped
    ports:
      - "26258:26257"
      - "8081:8080"
    networks:
      - crdb-cluster
    volumes:
      - crdb2-data:/cockroach/cockroach-data
    command:
      - start
      - --insecure
      - --join=crdb1:26257,crdb2:26257,crdb3:26257
      - --listen-addr=crdb2:26257
      - --advertise-addr=crdb2:26257
      - --http-addr=0.0.0.0:8080
      - --cache=512MiB
      - --max-sql-memory=512MiB
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health?ready=1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'

  crdb3:
    image: cockroachdb/cockroach:v23.2.4
    container_name: ycsb-crdb3
    hostname: crdb3
    restart: unless-stopped
    ports:
      - "26259:26257"
      - "8082:8080"
    networks:
      - crdb-cluster
    volumes:
      - crdb3-data:/cockroach/cockroach-data
    command:
      - start
      - --insecure
      - --join=crdb1:26257,crdb2:26257,crdb3:26257
      - --listen-addr=crdb3:26257
      - --advertise-addr=crdb3:26257
      - --http-addr=0.0.0.0:8080
      - --cache=512MiB
      - --max-sql-memory=512MiB
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health?ready=1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'

networks:
  crdb-cluster:
    driver: bridge
    name: ycsb-crdb-cluster-net

volumes:
  crdb1-data:
  crdb2-data:
  crdb3-data: